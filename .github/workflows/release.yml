name: release-wheels

# Construye ruedas Python (abi3, una por plataforma sirve para CPython 3.9+) y el
# sdist. En un tag además publica en PyPI. También ejecutable a mano.
#
# DOS paquetes, DOS cadencias, DOS patrones de tag:
#
#   v*        -> quipu-crypto       (el núcleo, AGPL, pyproject.toml de la raíz)
#   voprf-v*  -> quipu-voprf        (Apache-2.0, crates/quipu-voprf)
#   django-v* -> quipu-oprf-django  (Apache-2.0, integrations/django)
#
# Van por separado a propósito. `quipu-voprf` se versiona solo: publicar sus
# primitivas no debe obligar a sacar una versión del núcleo, ni al revés. Además
# un tag `v*` reconstruiría la versión que diga el pyproject de la raíz, que hoy
# es una ya publicada — arrastrar eso solo para sacar otro paquete es pedir un
# accidente. Los patrones son disjuntos: `refs/tags/voprf-v0.1.0` NO empieza por
# `refs/tags/v`, así que cada tag dispara solo lo suyo.
on:
  push:
    tags: ["v*", "voprf-v*", "nucleo-v*", "django-v*", "padme-v*", "cnsa-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels-${{ matrix.os }}
    # GATE POSITIVO: solo el tag de `quipu` construye la rueda de `quipu`.
    #
    # Antes esto era una lista de negaciones (`!voprf-v && !django-v`), y una
    # lista de negaciones falla por lo que NO enumera: un tag `nucleo-v*` no
    # está en ella, así que construía las tres ruedas —ubuntu, macOS y
    # Windows— para después no publicarlas, porque el job `pypi` sí exige
    # `refs/tags/v`. Minutos pagados por un artefacto que se tira.
    #
    # Añadir `!padme-v` habría arreglado EL CASO y dejado la regla igual de
    # rota para el sexto crate (directiva 23). La regla correcta es la que ya
    # usaba `pypi`, y ahora la usan los tres.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voprf-v') && !startsWith(github.ref, 'refs/tags/nucleo-v') && !startsWith(github.ref, 'refs/tags/django-v') && !startsWith(github.ref, 'refs/tags/padme-v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # SIN `--features`: maturin lee `[tool.maturin] features` de
      # pyproject.toml y lo anuncia en el log («Using build options features
      # from pyproject.toml»).
      #
      # Aquí ESTABA repetida la lista, y por eso la rueda 0.9.0 salió a PyPI sin
      # `hsm`: se añadió la feature a pyproject.toml y nadie tocó este archivo.
      # Un usuario instalaba, importaba `CustodioHsm` y no estaba.
      #
      # La solución no es comprobar que los dos archivos coincidan —eso es un
      # mecanismo para contener lo que creó otro— sino que solo haya UNO. Así la
      # divergencia no se detecta: deja de ser posible.
      #
      # Verificado el 2026-07-21 construyendo la rueda sin la bandera e
      # instalándola en un venv limpio: `encode`, `decode`, `split_secret`,
      # `combine_secret` y `CustodioHsm` están todos. Comprobado contra el
      # ARTEFACTO, no contra el mensaje del log.
      # I5: la rueda PUBLICADA tiene que derivarse del código, no del momento de
      # construirla. Sin esto, el CI comprobaría una propiedad que el artefacto
      # que descarga la gente no tiene.
      #
      # SOURCE_DATE_EPOCH sale de la fecha del commit: fija el `timestamp` y el
      # `serialNumber` del SBOM CycloneDX que maturin mete en el dist-info, que
      # medido el 2026-07-31 eran la ÚNICA fuente de no-determinismo de la rueda
      # (el `.so` ya salía byte a byte idéntico).
      #
      # RUSTFLAGS quita las rutas absolutas del runner del binario — eran 72 con
      # el `$HOME` de quien construye, y son bytes distintos en cada máquina.
      - name: Entorno reproducible
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build wheels (maturin; las features salen de pyproject.toml)
        uses: PyO3/maturin-action@v1
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
        with:
          command: build
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    name: sdist
    # Mismo gate positivo que `wheels`: ver el porqué allí.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voprf-v') && !startsWith(github.ref, 'refs/tags/nucleo-v') && !startsWith(github.ref, 'refs/tags/django-v') && !startsWith(github.ref, 'refs/tags/padme-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Solo publica al hacer un tag v*.
    # OJO: 'refs/tags/voprf-v*' TAMBIEN empieza por 'refs/tags/v' ("voprf"
    # empieza por "v"). Sin excluirlo, un tag de quipu-voprf dispararia el
    # release del nucleo. Hoy se salvaria porque sus `needs` no corren, pero
    # eso es suerte, no diseno.
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voprf-v') && !startsWith(github.ref, 'refs/tags/django-v')
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), sin token en secretos
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Acción oficial de PyPA: soporta trusted publishing (OIDC) de forma nativa,
      # sin necesidad de token. Sube todo lo que haya en dist/ (ruedas + sdist).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # --- quipu-voprf (Apache-2.0) -----------------------------------------------
  # Paquete aparte, tag aparte (voprf-v*). Es lo UNICO que un cliente del
  # servicio OPRF instala en su servidor de auth: no puede arrastrar la AGPL del
  # nucleo, y por eso vive en su propio crate y su propia rueda. Ver LICENSING.md §0.

  voprf-wheels:
    name: voprf-wheels-${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/voprf-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # `manylinux: auto` construye en contenedor contra una glibc vieja. Sin
      # esto, la rueda sale atada a la glibc del runner y deja fuera a medio
      # mundo -- y en PyPI una version no se puede re-subir, solo retirar.
      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # Sin `--features`: salen de crates/quipu-voprf/pyproject.toml.
          args: --release --out dist -m crates/quipu-voprf/Cargo.toml
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: voprf-wheels-${{ matrix.os }}
          path: dist

  voprf-sdist:
    name: voprf-sdist
    if: startsWith(github.ref, 'refs/tags/voprf-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/quipu-voprf/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: voprf-sdist
          path: dist

  publish-voprf:
    name: publish quipu-voprf to PyPI
    needs: [voprf-wheels, voprf-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/voprf-v')
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), sin token en secretos
    steps:
      # `pattern` y merge-multiple: solo los artefactos de voprf. Sin el patron
      # se colarian los del nucleo si algun dia coincidieran en la misma run.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: voprf-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # --- quipu-oprf-django (Apache-2.0) ------------------------------------------
  # Python PURO (setuptools), no maturin: no hay Rust que compilar, asi que ni
  # ruedas por plataforma ni matriz. Una rueda universal y el sdist.

  django-dist:
    name: django-dist
    if: startsWith(github.ref, 'refs/tags/django-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheel + sdist
        working-directory: integrations/django
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: django-dist
          path: integrations/django/dist

  publish-django:
    name: publish quipu-oprf-django to PyPI
    needs: [django-dist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/django-v')
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), sin token en secretos
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: django-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  sign:
    name: sign artifacts (sigstore) + GitHub Release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # OJO: 'refs/tags/voprf-v*' TAMBIEN empieza por 'refs/tags/v' ("voprf"
    # empieza por "v"). Sin excluirlo, un tag de quipu-voprf dispararia el
    # release del nucleo. Hoy se salvaria porque sus `needs` no corren, pero
    # eso es suerte, no diseno.
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voprf-v') && !startsWith(github.ref, 'refs/tags/django-v')
    permissions:
      id-token: write   # cosign keyless (OIDC), sin claves en secretos
      contents: write   # crear el GitHub Release y adjuntar artefactos + firmas
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign each artifact (keyless)
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "${f}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: signatures
          path: dist/*.sigstore
          if-no-files-found: error
      # Publica un GitHub Release con las ruedas/sdist Y sus bundles .sigstore,
      # para que cualquiera pueda `cosign verify-blob --bundle` según docs/RELEASES.md.
      - name: Create GitHub Release with signed artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Artefactos firmados con sigstore/cosign (keyless, OIDC).
            Verificación: ver [`docs/RELEASES.md`](https://github.com/isazajuancarlos/quipu/blob/estable/docs/RELEASES.md)
            (attestations PEP 740 en PyPI + `cosign verify-blob --bundle` para cada `.sigstore`).

  # --- crates.io (Trusted Publishing OIDC, #127) ------------------------------
  # Publica los crates a crates.io SIN token de larga vida. La acción oficial
  # `rust-lang/crates-io-auth-action` canjea el OIDC de GitHub por un token
  # EFÍMERO y scoped; `cargo publish` lo usa vía CARGO_REGISTRY_TOKEN. Cada crate
  # tiene su publicador de confianza en crates.io (owner isazajuancarlos, repo
  # quipu, workflow release.yml, environment `release`), así que solo estos jobs,
  # en esta rama, pueden publicar. Con esto se borra el token de crates.io de
  # larga vida (era el único registro que lo tenía; ver #127/#203).
  #
  # UN TAG POR CRATE, como en PyPI:  v* -> quipu · voprf-v* -> quipu-voprf ·
  # nucleo-v* -> quipu-nucleo. `quipu` depende de nucleo y voprf ya publicados,
  # así que un release de solo quipu basta con su tag; si se bumpean los tres, se
  # empujan los tags en orden nucleo -> voprf -> quipu (crates.io rechaza `quipu`
  # si sus dependencias por versión no están en el índice).
  #
  # El checkout de CI es limpio, así que el problema del `.crate` de 220 MiB por
  # basura sin rastrear (que ocurre en el `cargo publish` LOCAL) aquí no aplica.

  crate-quipu:
    name: publish quipu to crates.io
    # Mismo patrón que el publish de PyPI del núcleo: 'voprf-v*' TAMBIÉN empieza
    # por 'refs/tags/v', así que se excluye a mano; 'nucleo-v*'/'django-v*' no,
    # pero se excluyen por claridad.
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voprf-v') && !startsWith(github.ref, 'refs/tags/nucleo-v') && !startsWith(github.ref, 'refs/tags/django-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # crates.io trusted publishing (OIDC), sin token de larga vida
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Autenticar contra crates.io por OIDC (token efímero)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish -p quipu
        run: cargo publish -p quipu
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  crate-voprf:
    name: publish quipu-voprf to crates.io
    if: startsWith(github.ref, 'refs/tags/voprf-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Autenticar contra crates.io por OIDC (token efímero)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish -p quipu-voprf
        run: cargo publish -p quipu-voprf
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # `padme-frame` va PRIMERO en la cadena: `quipu-nucleo` depende de él por
  # `path` + `version`, así que crates.io rechaza `quipu-nucleo` mientras
  # `padme-frame` no esté en el índice. El orden completo es
  #   padme-frame -> quipu-nucleo -> quipu-voprf -> quipu
  # y es el mismo fallo que ya costó una publicación con `quipu-voprf`: un
  # `path` que en el árbol resuelve solo y en el índice no existe.
  #
  # Este job NUNCA se ha ejecutado: el crate nació el 2026-08-01 y sigue sin
  # publicar. El primer `padme-v*` que se empuje es también su estreno.
  #
  # Y SU ESTRENO VA A FALLAR. No es una sospecha: la documentación de crates.io
  # lo dice literalmente entre los prerrequisitos de trusted publishing —
  # «Your crate must already be published to crates.io (initial publish requires
  # an API token)» (rust-lang/crates.io, svelte/src/routes/docs/trusted-publishing).
  # La configuración de OIDC vive en Settings → Trusted Publishing DEL CRATE, y
  # un crate que no existe no tiene ajustes. Comprobado el 2026-08-03 contra el
  # índice: `padme-frame` da 404.
  #
  # O sea que este job sirve de la SEGUNDA versión en adelante. La 0.1.0 hay que
  # subirla a mano con un token de API, y solo después se configura el trusted
  # publishing que hace funcionar el tag. Empujar `padme-v0.1.0` esperando que
  # publique es perder el tag y tener que borrarlo.
  crate-padme:
    name: publish padme-frame to crates.io
    if: startsWith(github.ref, 'refs/tags/padme-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Autenticar contra crates.io por OIDC (token efímero)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish -p padme-frame
        run: cargo publish -p padme-frame
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # `quipu-cnsa` no lleva `publish = false`, o sea que ES publicable, y hasta el
  # 2026-08-02 no tenía ni tag ni job: un crate terminado —52+10 pruebas en
  # verde, perfil simétrico y asimétrico— sin ninguna forma de salir. Lo delató
  # `verificar_deriva_desde_el_tag`, que se negó a aprobarlo por no tener
  # prefijo declarado en vez de callarse.
  #
  # Depende de `quipu-nucleo`, así que va DESPUÉS de él en la cadena.
  #
  # MISMO ESTRENO FALLIDO que `crate-padme`, y por la misma razón: `quipu-cnsa`
  # tampoco está en el índice (404 el 2026-08-03), y el trusted publishing exige
  # que el crate exista para poder configurarlo. Su 0.1.0 también va a mano con
  # token. Los dos crates SIN publicar del workspace son exactamente estos dos;
  # `quipu-nucleo`, `quipu-voprf` y `quipu` sí existen (200), así que sus jobs
  # sí funcionan por tag.
  crate-cnsa:
    name: publish quipu-cnsa to crates.io
    if: startsWith(github.ref, 'refs/tags/cnsa-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Autenticar contra crates.io por OIDC (token efímero)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish -p quipu-cnsa
        run: cargo publish -p quipu-cnsa
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  crate-nucleo:
    name: publish quipu-nucleo to crates.io
    if: startsWith(github.ref, 'refs/tags/nucleo-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Autenticar contra crates.io por OIDC (token efímero)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish -p quipu-nucleo
        run: cargo publish -p quipu-nucleo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
