name: CI

# Se activa cuando el proyecto pase a git/GitHub. Mientras tanto, el equivalente
# local es `scripts/audit.sh`.
on:
  push:
    branches: [estable, testing, desarrollo]
  pull_request:
  schedule:
    # Auditoría semanal de dependencias aunque no haya cambios (nuevas CVEs).
    - cron: "0 6 * * 1"

permissions:
  # Menor privilegio (supply-chain #203): todos los jobs de este CI son de solo
  # lectura (build/test/clippy/audit/vet/sbom/fuzz/hsm). release.yml fija sus
  # propios permisos por job. Sin este bloque el GITHUB_TOKEN hereda permisos amplios.
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--workspace` NO es decorativo. Sin él, y con un `[package]` en la raíz
      # del workspace, cargo prueba SOLO `quipu`: 137 pruebas de las 235 que
      # existen. Quedaban fuera los vectores RFC 9497 de `quipu-voprf`, el e2e
      # del servidor OPRF, el ABI de C y —desde que se extrajo el núcleo— los
      # bancos de glifos. Medido el 2026-07-21: el job pasó de 37 minutos a 4
      # al mudarse esas pruebas de crate, y el CI lo reportó como verde.
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--all-targets` EXCLUYE los doctests, pese al nombre. Sin este paso, los
      # ejemplos de la documentación no se compilan nunca — documentación que no
      # se ejecuta es documentación que miente. Comprobado el 2026-07-21: el CI
      # llevaba desde siempre sin ejecutar uno solo.
      - name: Doctests (los ejemplos de la documentación deben compilar)
        run: cargo test --workspace --doc
      # El banco de `herramientas/verificar.py`. NO se corre `verificar.py
      # local` entero: duplicaría las pruebas de arriba y triplicaría el tiempo
      # del job. Lo que sí protege esto son sus comprobaciones estructurales —
      # entre ellas que `release.yml` no vuelva a repetir la lista de features,
      # que es lo que dejó la rueda 0.9.0 sin `hsm`.
      - name: Banco del verificador
        run: python3 herramientas/probar_verificar.py
      - name: Tests (slh feature, release — SLH-DSA signing is slow in debug)
        run: cargo test --features slh --release
      - name: Clippy (slh feature, deny warnings)
        run: cargo clippy --features slh --all-targets --release -- -D warnings
      - name: Tests (honey feature — decoy encryption)
        run: cargo test --features honey --all-targets
      - name: Test (escrow)
        run: cargo test --features escrow --all-targets
      - name: Clippy (honey feature, deny warnings)
        run: cargo clippy --features honey --all-targets -- -D warnings
      - name: Clippy (escrow)
        run: cargo clippy --features escrow --all-targets -- -D warnings
      - name: Tests (negacion — contenedor con señuelo y volumen oculto)
        run: cargo test --features negacion --all-targets
      - name: Clippy (negacion, deny warnings)
        run: cargo clippy --features negacion --all-targets -- -D warnings
      # Custodia del seed del OPRF (Shamir k-de-n). Es feature del CRATE DEL
      # SERVIDOR, no del núcleo, y no-default: no viaja en el binario del VPS.
      # Va aquí porque una herramienta que solo se usa el día del desastre es
      # justo la que se pudre sin que nadie lo note. Incluye la prueba que
      # levanta el binario real y comprueba que sirve la MISMA clave pública.
      - name: Tests (custodia del seed — restauración verificada)
        run: cargo test -p quipu-oprf-server --features custodia --all-targets
      - name: Clippy (custodia del seed)
        run: cargo clippy -p quipu-oprf-server --features custodia --all-targets -- -D warnings
      # El camino de ERROR de las autopruebas es el único que nunca se ejecuta en
      # un build normal, y es el que tiene que funcionar el día que haga falta.
      - name: Tests (autopruebas — camino de fallo, inyección)
        run: cargo test --features selftest-fault --lib selftest
      # Simulación en volumen y concurrencia: 200 pasadas + 100 hebras + 1000
      # llamadas repetidas. Un interbloqueo sale como fallo, no como cuelgue.
      - name: Simulación de autopruebas (1300 operaciones)
        run: cargo run --release --example selftest_soak

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  security-lab:
    name: security lab (feature-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Isolation — el arma no viaja en el build por defecto
        run: |
          # Ningún módulo NO-lab debe referenciar crate::lab.
          if grep -rn "crate::lab" src --include='*.rs' | grep -v '^src/lab/' | grep -v 'cfg(feature = "lab")'; then
            echo "FALLO: referencia a crate::lab fuera del laboratorio" && exit 1
          fi
          # El build por defecto (el que se publica) no debe compilar el laboratorio.
          cargo build
      - name: Lab tests
        run: cargo test --features lab --lib lab
      - name: Lab tests (streaming forgery)
        run: cargo test --features lab stream_attack
      - name: Lab example
        run: cargo run --example securitylab --features lab
      - name: Clippy (lab, deny warnings)
        run: cargo clippy --features lab --all-targets -- -D warnings
      - name: Lab tests (triple-hybrid forgery, release)
        run: cargo test --features "lab slh" --release forge_triple
      - name: Lab tests (honey success-oracle)
        run: cargo test --features "lab honey" honey_attack
      - name: Lab tests (honey parser fuzz)
        run: cargo test --features "lab honey" honey_fuzz
      # El banco del §8 del diseño de negación: contenedor contra azar, con
      # oculto contra sin oculto, y ninguna posición predecible. Trae sus cuatro
      # casos ROJOS dentro, así que un verde aquí significa que las sondas ven.
      - name: Lab tests (negación — banco de indistinguibilidad)
        run: cargo test --features "lab negacion" --test negacion_indistinguibilidad
      # Directiva 8: 120 contenedores, 104 aperturas concurrentes con timeout, y
      # el camino de error inyectado que demuestra que la de arriba discrimina.
      # Va con `lab` porque el perfil barato es lo que la hace correr en el CI
      # sin pedir 2 GB; el formato que ejercita es el mismo.
      - name: Lab tests (negación — simulación)
        run: cargo test --features "lab negacion" --test negacion_simulacion
      - name: Clippy (lab + negacion, deny warnings)
        run: cargo clippy --features "lab negacion" --all-targets -- -D warnings
      - name: Red-team (all surfaces consolidated)
        run: cargo run --example redteam --features "lab slh honey" --release

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM (JSON)
        run: cargo cyclonedx --format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            *.cdx.json
            bom.json
          if-no-files-found: error

  vet:
    name: cargo-vet (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Vet dependencies
        run: cargo vet --locked

  # Cada feature declarada, compilada por separado, más todas juntas.
  #
  # Existe porque el 2026-07-21 se descubrió que `lab-offline` llevaba sin
  # compilar desde 0.9.0 — y no solo en el repositorio: el `.crate` publicado en
  # crates.io tampoco compilaba. Nadie lo vio porque el job `test + clippy`
  # prueba las features de una en una pero NUNCA `lab-offline` ni todas juntas.
  #
  # La lista se DERIVA de Cargo.toml, no se escribe a mano. Una lista repetida
  # es una lista que diverge: fue exactamente así como la rueda de PyPI 0.9.0
  # salió sin la feature `hsm`.
  #
  # Solo compila, no prueba: el banco offline tarda demasiado para cada PR, y lo
  # que esta clase de defecto rompe es la compilación.
  features:
    name: matriz de features (compila todas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar cada feature declarada en Cargo.toml
        run: |
          set -o pipefail
          features=$(python3 -c "
          import tomllib
          with open('Cargo.toml','rb') as f:
              print(' '.join(sorted(tomllib.load(f).get('features', {}))))
          ")
          echo "Features declaradas: $features"
          fallos=0
          for f in $features; do
            echo "::group::--features $f"
            if cargo build --workspace --all-targets --features "$f"; then
              echo "OK: $f"
            else
              echo "::error::la feature '$f' NO compila"
              fallos=$((fallos + 1))
            fi
            echo "::endgroup::"
          done
          echo "::group::--all-features"
          if cargo build --workspace --all-targets --all-features; then
            echo "OK: todas juntas"
          else
            echo "::error::--all-features NO compila"
            fallos=$((fallos + 1))
          fi
          echo "::endgroup::"
          if [ "$fallos" -gt 0 ]; then
            echo "$fallos combinación(es) de features no compilan."
            exit 1
          fi

  # Las pruebas de `integrations/django`, que el CI NUNCA había ejecutado.
  #
  # El coste de esa ausencia se vio el 2026-07-21: cuando `client.py` cambió de
  # importar `quipu` (núcleo AGPL) a `quipu_voprf` (SDK Apache-2.0) —el reparto
  # de licencias que hace vendible el plugin—, nadie actualizó el doble de
  # pruebas del `conftest`, que seguía parcheando `quipu`. Once pruebas
  # «pasaban» solo porque la librería real no estaba instalada, y fallaban en
  # cuanto se instalaba. Es decir: pasaban por la razón equivocada.
  #
  # Se instala `quipu-voprf` DE VERDAD a propósito. Si el doble volviera a
  # apuntar al módulo equivocado, estas pruebas lo delatan en vez de fingir.
  integraciones:
    name: integraciones (django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Instalar el paquete con sus dependencias reales
        working-directory: integrations/django
        run: |
          python -m pip install --upgrade pip
          pip install . pytest django
      - name: Pruebas
        working-directory: integrations/django
        run: python -m pytest -q
      # Construir aquí también atrapa lo que un `pip install .` no ve: PEP 639
      # rechaza los clasificadores de licencia junto a una expresión SPDX, y eso
      # solo revienta al construir la distribución — o sea, en mitad del release.
      - name: Construir la distribución (lo que hará el release)
        working-directory: integrations/django
        run: |
          pip install build twine
          python -m build --outdir dist
          twine check dist/*

  # La versión, en los 13 sitios donde vive, tiene que ser LA MISMA.
  #
  # Es el error que más veces se ha repetido en este proyecto, y hasta hoy la
  # defensa era una lista en prosa dentro del CLAUDE.md más un `grep`. Auditada
  # el 2026-07-27, esa defensa no veía `Cargo.lock` (el `grep` filtraba por
  # `*.toml` y `Cargo.lock` no lo es), contaba `pyproject.toml` que no lleva
  # versión, y trataba un rango de dependencia como si fuera una versión propia.
  #
  # Segundos de CI contra un `yank` de PyPI, que es lo que costó equivocarse la
  # última vez. Va en su propio job y no dentro de `test + clippy` para que falle
  # en diez segundos en vez de en cuatro minutos: quien sube una versión quiere
  # saberlo ya.
  versiones:
    name: coherencia de versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Todos los sitios de versión concuerdan
        run: python3 herramientas/verificar.py version

  # La rueda de Python: se construye y se PRUEBA, con las features del release.
  #
  # `tests/python/test_quipu.py` existía con quince pruebas y NINGÚN workflow lo
  # ejecutaba. Es la misma clase de defecto que el binding de honey que este PR
  # borra —algo que parece cubierto y no opera—, pero al revés: aquí borrarlo
  # habría quitado cobertura de verdad, así que lo que faltaba era encenderlo.
  # Hasta hoy, el binding de Python solo se compilaba; nada lo ejecutaba fuera
  # del release, que es el peor momento para enterarse.
  #
  # Se construye SIN `--features` a propósito: así maturin lee
  # `[tool.maturin] features` de `pyproject.toml`, exactamente como el release.
  # Pasarlas a mano aquí reproduciría el defecto de 0.9.0, cuando `release.yml`
  # llevaba su propia lista y publicó una rueda sin `hsm` mientras el README ya
  # la anunciaba — y PyPI no deja re-subir una versión.
  #
  # El paso de superficie es el que habría cazado aquello: comprueba que la
  # rueda TRAE lo que sus features prometen, en vez de dar por hecho que el
  # `success` del build lo garantiza.
  rueda-python:
    name: rueda de Python (build + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # LAS DOS VARIABLES QUE HACEN LA RUEDA REPRODUCIBLE (invariante I5).
      # Medido el 2026-07-31: sin ellas, dos corridas seguidas en la MISMA máquina
      # dan ruedas distintas. La causa no era el compilador —el `quipu.abi3.so`
      # salía byte a byte idéntico— sino dos campos del SBOM CycloneDX que
      # generamos nosotros: un `serialNumber` UUID aleatorio y un `timestamp` de
      # reloj. El `RECORD` difería solo porque hashea el SBOM.
      #
      # SOURCE_DATE_EPOCH sale de la fecha del COMMIT, no de `now`: así el
      # artefacto se deriva del código y no del momento de construirlo, que es
      # justo lo que I5 promete.
      #
      # RUSTFLAGS quita las rutas absolutas de la máquina. El binario llevaba
      # cadenas `/home/<usuario>/.cargo/registry/...` de los metadatos de `panic`,
      # y en otra máquina eso son otros bytes. Con el remap desaparecen todas.
      # (Las dos cifras que se verán al medirlo: 72 líneas con `strings | grep -c`
      # y 57 coincidencias únicas con el detector de abajo. Es el mismo fenómeno
      # contado de dos maneras, no dos hallazgos.)
      # (`[profile.release] trim-paths` haría lo mismo más limpio, pero NO está
      # estabilizado en cargo 1.97.1: comprobado, no supuesto.)
      - name: Entorno reproducible
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo/registry/src=/cargo --remap-path-prefix=$PWD=/build" >> "$GITHUB_ENV"
      - name: Construir la rueda como la construye el release
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest
          maturin build --out dist
      # I5 NO SE AFIRMA, SE COMPRUEBA. Se construye una segunda vez y se exige el
      # mismo sha256. Si alguien reintroduce una fuente de no-determinismo —o
      # quita las variables de arriba— esto se pone rojo aquí, no en el momento en
      # que a un auditor externo no le cuadren los bytes de PyPI.
      #
      # LO QUE ESTE CHECK NO PRUEBA, y conviene que esté escrito al lado y no en
      # un doc aparte: aquí se construye con `maturin build` sobre ubuntu-latest,
      # mientras que `release.yml` construye con maturin-action y `manylinux:
      # auto`, o sea DENTRO DE UN CONTENEDOR distinto. Así que esto caza el
      # no-determinismo de origen —el SBOM, las rutas, cualquier fuente que se
      # cuele en el código— pero NO demuestra que la rueda manylinux publicada sea
      # bit a bit reconstruible. Eso exige rehacer el artefacto publicado en su
      # mismo contenedor y comparar, y es el trabajo que queda de I5.
      - name: La rueda se reconstruye byte a byte igual
        run: |
          maturin build --out dist-bis
          uno=$(sha256sum dist/*.whl | cut -d' ' -f1)
          dos=$(sha256sum dist-bis/*.whl | cut -d' ' -f1)
          echo "1ª: $uno"
          echo "2ª: $dos"
          if [ "$uno" != "$dos" ]; then
            echo "::error::la rueda NO es reproducible: dos construcciones del mismo commit dan bytes distintos"
            command -v diffoscope >/dev/null && diffoscope dist/*.whl dist-bis/*.whl || true
            exit 1
          fi
          rm -rf dist-bis
      # Y que el remap de verdad borró las rutas de la máquina, no solo que las
      # dos corridas coincidan: coincidir es fácil si ambas están igual de sucias.
      - name: El binario no lleva rutas de la máquina que lo construyó
        run: |
          python -c "
          import glob, zipfile, re, sys
          whl = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              so = next(n for n in z.namelist() if n.endswith('.so'))
              datos = z.read(so)
          fugas = set(re.findall(rb'/(?:home|Users|root)/[A-Za-z0-9._-]+/[^\x00\"]{0,80}', datos))
          if fugas:
              for f in sorted(fugas)[:10]:
                  print(f.decode('utf-8', 'replace'))
              sys.exit(f'{len(fugas)} rutas de la máquina dentro del binario: el remap no está actuando')
          print('sin rutas de la máquina en el binario')
          "
      - name: Instalar la rueda recién construida
        run: pip install --no-index --find-links dist quipu-crypto
      - name: La rueda trae lo que sus features prometen
        run: |
          python - <<'PY'
          import tomllib, sys, quipu
          with open("pyproject.toml", "rb") as f:
              features = tomllib.load(f)["tool"]["maturin"]["features"]
          # Qué símbolo demuestra que cada feature viajó de verdad.
          testigo = {
              "escrow": ["split_secret", "combine_secret"],
              "hsm": ["CustodioHsm"],
              "honey": ["honey_encrypt_pin", "honey_decrypt_pin"],
          }
          faltan = [n for f in features for n in testigo.get(f, []) if not hasattr(quipu, n)]
          if faltan:
              sys.exit(f"la rueda declara {features} pero no expone: {faltan}")
          # Y al revés: nada de lo que la rueda NO declara puede aparecer.
          sobran = [
              n for f, ns in testigo.items() if f not in features
              for n in ns if hasattr(quipu, n)
          ]
          if sobran:
              sys.exit(f"la rueda expone lo que no declara ({features}): {sobran}")
          print(f"features {features}; version {quipu.version()}")
          PY
      - name: Pruebas del binding
        run: python -m pytest tests/python -q

  fuzz:
    name: fuzz (smoke, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Smoke corto por target: garantiza que el harness compila y que ninguna
      # entrada del corpus/seed provoca crash. El fuzzing largo va por cron/local.
      #
      # LA LISTA SE DERIVA, NO SE ESCRIBE. Aquí había cuatro nombres a mano y
      # habrían dejado fuera los dos objetivos nuevos (parse_signed,
      # parse_recipient) sin que nadie lo notara: el job seguiría verde fuzzeando
      # menos de lo que hay. Es el mismo defecto que la lista de doce archivos de
      # versión y el banco del verificador — un registro que hay que acordarse de
      # ampliar es un registro que diverge.
      # EL CORPUS SE DERIVA, NO SE GUARDA. `fuzz/corpus` está en .gitignore, así
      # que en una copia limpia —o sea, SIEMPRE en CI— no hay ni una unidad. Sin
      # este paso, `parse_signed` no puede pasar su comprobación de longitud: el
      # parser exige 4701 bytes y el -max_len por defecto de libFuzzer es 4096, de
      # modo que el objetivo corría 20 s rechazando por corto y salía verde. Y el
      # encadenado de abajo no tendría nada que encadenar.
      #
      # Se genera en vez de commitear por lo mismo que la lista de objetivos sale
      # de `cargo fuzz list`: un artefacto guardado que hay que acordarse de
      # regenerar es un artefacto que diverge del formato al que dice pertenecer.
      - name: Sembrar el corpus
        run: cargo run --release --example gen_semillas_fuzz

      # EL CORPUS SE ENCADENA DENTRO DE SU FAMILIA DE IDIOMA, no entre todos.
      # `parse_container`, `unpad`, `parse_signed` y `parse_recipient` consumen el
      # MISMO idioma —blob crudo con mágico, versión y campos de longitud en
      # offsets fijos—, así que lo que uno descubre le sirve a los otros tres y se
      # les pasa su corpus como entrada de solo lectura. `honey_decrypt` y
      # `codec_roundtrip` quedan fuera porque su primer byte significa otra cosa:
      # mezclarlos sería ruido disfrazado de cobertura. La tabla y el porqué, en
      # fuzz/README.md.
      #
      # libFuzzer escribe SOLO en el primer directorio; los hermanos van detrás y
      # no se contaminan.
      - name: Smoke every fuzz target
        run: |
          set -o pipefail
          objetivos=$(cargo fuzz list)
          if [ -z "$objetivos" ]; then
            echo "::error::cargo fuzz list no devolvió ningún objetivo"
            exit 1
          fi
          echo "Objetivos detectados: $objetivos"
          familia_blob="parse_container unpad parse_signed parse_recipient"
          for t in $objetivos; do
            # Al pasar el corpus EXPLÍCITO, libFuzzer exige que el directorio
            # exista y aborta si no —cargo-fuzz solo lo crea cuando no le pasas
            # ninguno—. `codec_roundtrip` y `honey_decrypt` no se siembran, así
            # que sin este mkdir el job muere en el primer objetivo. Lo cazó
            # correr esto contra una copia limpia; con el corpus local de la
            # máquina de desarrollo pasaba en verde.
            mkdir -p "fuzz/corpus/$t"
            corpus="fuzz/corpus/$t"
            case " $familia_blob " in
              *" $t "*)
                for h in $familia_blob; do
                  [ "$h" = "$t" ] && continue
                  [ -d "fuzz/corpus/$h" ] && corpus="$corpus fuzz/corpus/$h"
                done
                ;;
            esac
            echo "::group::fuzz $t  [corpus: $corpus]"
            cargo fuzz run "$t" $corpus -- -max_total_time=20
            echo "::endgroup::"
          done


  hsm:
    name: HSM (PKCS#11 contra kryoptic)
    runs-on: ubuntu-latest
    # kryoptic con ML-DSA exige OpenSSL 3.5; ubuntu-latest trae 3.0. Fedora 43 ya
    # empaqueta kryoptic con la feature `pqc` y el módulo en /usr/lib64/pkcs11.
    container: fedora:43
    steps:
      - uses: actions/checkout@v7
      - name: Instalar kryoptic y el toolchain de Rust
        # kryoptic trae libkryoptic_pkcs11.so; cargo/gcc para compilar quipu.
        # cryptoki carga el .so por dlopen en runtime, así que aquí no hace falta
        # OpenSSL en tiempo de compilación de quipu.
        run: dnf install -y kryoptic cargo gcc
      - name: Prueba del custodio PKCS#11
        # Firma DENTRO del token y verifica con el verificador puro de quipu.
        env:
          QUIPU_PKCS11_MODULE: /usr/lib64/pkcs11/libkryoptic_pkcs11.so
          KRYOPTIC_CONF: ${{ runner.temp }}/kryoptic-token.sql
        # --test-threads=1: C_Initialize del módulo es un singleton del proceso.
        run: cargo test --features hsm --test hsm_pkcs11 -- --test-threads=1
