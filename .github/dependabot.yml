# Actualización automática de dependencias y de las acciones de GitHub.
#
# Higiene de una librería de seguridad: mantener la cadena de suministro al día
# y que los avisos de RustSec lleguen como PR. Los saltos menores y de parche se
# agrupan para no llenar de ruido; los mayores vienen sueltos, porque un cambio
# que rompe merece su propia revisión.
#
# Desde 0.10 solo hay DOS ecosistemas. Los de npm y Go se retiraron con los
# envoltorios que vigilaban: Quipu es Rust, y se distribuye como crate y como
# rueda de PyPI construida del mismo código.
version: 2
updates:
  # Acciones de GitHub usadas en ci.yml y release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # El workspace de Rust: el crate raíz, quipu-nucleo, quipu-cnsa, quipu-voprf,
  # el servidor OPRF y el binding de Python (PyO3).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # El plugin de Django, que es Python puro y depende de quipu-voprf.
  - package-ecosystem: pip
    directory: /integrations/django
    schedule:
      interval: weekly
    groups:
      pip-minor:
        patterns: ["*"]
        update-types: [minor, patch]
