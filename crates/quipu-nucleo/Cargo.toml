[package]
name = "quipu-nucleo"
# 0.1.2 y no 0.2.0: el cambio respecto a la 0.1.1 publicada es ESTRICTAMENTE
# ADITIVO, comprobado ítem a ítem sobre la superficie pública —lo único que
# aparece es `ecc::PARIDAD_MAXIMA` y el módulo `papel`; no se quitó ni se
# cambió de firma nada—. En 0.x el minor hace de major para cargo, así que
# subirlo a 0.2.0 declararía una ruptura que no ocurrió y obligaría a mover los
# requisitos de `quipu` y `quipu-cnsa` para nada.
#
# La extracción de Padmé a `padme-frame` tampoco rompe: `prelayers` conserva los
# mismos nombres y firmas, y el FORMATO sale byte a byte idéntico —medido en
# `crates/padme-frame/tests/paridad_con_la_implementacion_original.rs` sobre
# 200 000 longitudes contra una copia literal del código de la 0.1.1—. Esa
# prueba existe porque la del envoltorio solo hace ida y vuelta consigo misma, y
# eso pasaría igual si el algoritmo hubiera cambiado.
version = "0.1.2"
edition = "2024"
description = "Núcleo agnóstico de primitivas de Quipu: formato del contenedor, codec base-N, Reed-Solomon y relleno Padmé. No contiene criptografía."
authors = ["Juan Carlos Isaza Arenas <isazajuancarlos@gmail.com>"]
license = "AGPL-3.0-or-later"
keywords = ["encoding", "codec", "reed-solomon", "container"]
categories = ["encoding"]
readme = "README.md"
repository = "https://github.com/isazajuancarlos/quipu"
homepage = "https://github.com/isazajuancarlos/quipu"
documentation = "https://docs.rs/quipu-nucleo"

[dependencies]
# Padmé, extraído a crate propio y PERMISIVO (MIT OR Apache-2.0) el 2026-08-01.
# La extracción a `quipu-nucleo` ya había pasado y no servía de nada: lo único
# que hace útil a Padmé fuera de Quipu es que cualquiera pueda enlazarlo, y con
# la AGPL de este crate nadie lo hace por un padding de 90 líneas.
padme-frame = { version = "0.1.0", path = "../padme-frame" }
# Aritmética de precisión arbitraria para el codec base-N.
num-bigint = "0.5"
# `Integer::div_rem`: cociente y resto en UNA pasada. Con `/` y `%` por separado
# el codec paga dos veces la división grande. Ya venía en el árbol como
# dependencia de num-bigint (mismo autor, rust-num); declararla no añade
# superficie nueva de cadena de suministro.
num-integer = "0.1"
num-traits = "0.2"
# Corrección de errores. Nació para el canal visual, que ya no existe (PR #93 y
# #99), y SE QUEDA porque el portador de papel previsto la necesita: la capa de
# respaldo es Base32 con Reed-Solomon en grupos, para que un dígito mal leído en
# una fotocopia no se lleve el mensaje.
reed-solomon = "0.2"

# --- Renderizado del símbolo de papel, OPCIONAL ---
# `qrcode` con `default-features = false` es un encoder SIN NINGUNA dependencia:
# su único `[dependencies]` es `image`, y es opcional (los renderizadores a PNG y
# SVG). Nosotros solo queremos la matriz de módulos, así que se queda en cero
# dependencias transitivas — el mejor resultado posible de cadena de suministro
# para una simbología estándar.
#
# Lo que se le exige es DISPONIBILIDAD, no confidencialidad: la carga es
# ciphertext más Reed-Solomon, así que un encoder con fallos solo puede producir
# un símbolo ilegible, nunca filtrar la clave.
qrcode = { version = "0.14", default-features = false, optional = true }

# --- Suma de verificación de la BIP-39, OPCIONAL ---
# La BIP-39 define su suma de verificación como los primeros ENT/32 bits de
# SHA-256 sobre la entropía. No hay alternativa: cambiarla sería inventar otro
# formato, y el formato ES el producto — lo que vale de la BIP-39 es que la
# decodifique cualquiera sin tener Quipu.
#
# Va OPCIONAL y detrás de `palabras` justamente para que la promesa de la
# portada siga siendo cierta al pie de la letra: la compilación por defecto de
# este crate no lleva ni una función criptográfica.
sha2 = { version = "0.11", default-features = false, optional = true }

[features]
# El símbolo hecho, para quien no quiera renderizarlo por su cuenta. NO-default:
# el núcleo no debe cargar con una dependencia de dibujo que la mayoría de los
# consumidores ya tienen resuelta en su frontend (ver docs/HOJA_DE_RUTA.md §6).
qr = ["dep:qrcode"]
# El marco de PALABRAS de la capa tecleable (BIP-39). NO-default por dos
# razones: arrastra `sha2`, y embebe una tabla de 2 048 palabras que la mayoría
# de los consumidores del núcleo no va a usar nunca.
palabras = ["dep:sha2"]

[dev-dependencies]
# Decoder de QR, SOLO para pruebas: el usuario decodifica con su teléfono y esto
# NO viaja en el artefacto. Existe para que la prueba de ida y vuelta no sea un
# `assert` sobre nuestro propio encoder — un encoder roto de forma consistente
# pasaría esa prueba y fallaría en el primer papel real.
rqrr = { version = "0.10", default-features = false }
# Implementación AJENA de la BIP-39, SOLO para pruebas. Mismo papel que `rqrr`
# con el QR y por la misma razón: una prueba de ida y vuelta contra nuestro
# propio codificador la pasaría igual un codificador roto de forma consistente.
# Lo que hay que demostrar es que OTRO lo lee, que es lo que promete el marco.
bip39 = { version = "2.2", default-features = false }
proptest = "1"
