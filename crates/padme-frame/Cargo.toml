[package]
name = "padme-frame"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Padmé padding with a self-describing length frame: pad and unpad round-trip, bounded overhead, no_std, zero dependencies."
authors = ["Juan Carlos Isaza Arenas <isazajuancarlos@gmail.com>"]
repository = "https://github.com/isazajuancarlos/quipu"
homepage = "https://github.com/isazajuancarlos/quipu"
documentation = "https://docs.rs/padme-frame"
readme = "README.md"
keywords = ["padding", "padme", "metadata", "privacy", "no-std"]
categories = ["no-std", "encoding", "cryptography"]

