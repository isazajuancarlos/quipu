# que cualquiera pueda enlazarlo. Con la AGPL, enlazarlo obliga a publicar el
# programa entero — nadie mete eso en su código por un padding de 90 líneas.
#
# `MIT OR Apache-2.0` es la doble licencia convencional de Rust, y se elige por
